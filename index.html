<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas - 3D Sphere World</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0e17;
            color: #e8edf5;
            overflow: hidden;
            height: 100vh;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            z-index: 10;
            text-align: center;
        }
        #hud h1 {
            font-weight: 300;
            font-size: 1.3rem;
            letter-spacing: 2px;
            background: rgba(10, 14, 23, 0.8);
            padding: 6px 20px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: inline-block;
        }
        #hud .sub {
            font-size: 0.7rem;
            opacity: 0.5;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        #toolbar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            background: rgba(10, 14, 23, 0.9);
            backdrop-filter: blur(16px);
            padding: 8px 14px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            pointer-events: auto;
            z-index: 20;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 98vw;
        }
        .tool-btn {
            background: transparent;
            border: none;
            color: #8899bb;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            letter-spacing: 0.3px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            white-space: nowrap;
        }
        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        .tool-btn.active {
            background: #2a7de1;
            color: white;
            box-shadow: 0 0 20px rgba(42, 125, 225, 0.2);
        }
        .tool-btn.primary {
            background: #1f8b4c;
            color: white;
        }
        .tool-btn.primary:hover {
            background: #28a85e;
        }
        .tool-btn.danger {
            background: #b13e3e;
            color: white;
        }
        .tool-btn.danger:hover {
            background: #d14a4a;
        }
        .tool-btn.ocean {
            background: rgba(0, 150, 255, 0.15);
            color: #4af;
        }
        .tool-btn.ocean:hover {
            background: rgba(0, 150, 255, 0.25);
        }
        .tool-btn.ocean.active {
            background: #0077be;
            color: white;
        }
        .tool-btn.sim {
            background: rgba(42, 125, 225, 0.15);
            color: #6af;
        }
        .tool-btn.sim:hover {
            background: rgba(42, 125, 225, 0.25);
        }

        #info {
            position: absolute;
            bottom: 100px;
            right: 20px;
            background: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(12px);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.7rem;
            min-width: 140px;
            pointer-events: none;
            z-index: 15;
        }
        #info .label {
            opacity: 0.4;
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #info .value {
            font-size: 0.8rem;
            margin-top: 1px;
        }
        #info .row {
            margin-bottom: 4px;
        }
        #info .row:last-child {
            margin-bottom: 0;
        }
        .ocean-data {
            color: #4af;
        }
        .sim-status {
            color: #6f8;
        }

        #controls {
            position: absolute;
            top: 80px;
            right: 20px;
            background: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(12px);
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            z-index: 15;
            min-width: 120px;
            pointer-events: auto;
        }
        #controls h4 {
            font-weight: 400;
            font-size: 0.65rem;
            opacity: 0.5;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }
        .toggle-item {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 0;
            cursor: pointer;
            border-radius: 4px;
            padding: 2px 6px;
        }
        .toggle-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .toggle-item input[type="checkbox"] {
            accent-color: #2a7de1;
            width: 12px;
            height: 12px;
            cursor: pointer;
        }
        .toggle-item label {
            font-size: 0.65rem;
            cursor: pointer;
            flex: 1;
        }
        .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #4a4;
            transition: 0.3s;
        }
        .dot.paused {
            background: #a44;
        }

        #ocean-controls {
            position: absolute;
            top: 80px;
            left: 20px;
            background: rgba(10, 14, 23, 0.85);
            backdrop-filter: blur(12px);
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            z-index: 15;
            min-width: 120px;
            pointer-events: auto;
        }
        #ocean-controls h4 {
            font-weight: 400;
            font-size: 0.65rem;
            opacity: 0.5;
            margin-bottom: 6px;
            letter-spacing: 1px;
            color: #4af;
        }
        .slider {
            width: 100%;
            margin: 2px 0;
            accent-color: #0077be;
            height: 3px;
        }
        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.55rem;
            opacity: 0.4;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #8899bb;
            font-size: 0.8rem;
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 20px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            z-index: 5;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        @media (max-width: 700px) {
            #toolbar {
                bottom: 10px;
                padding: 4px 8px;
                gap: 2px;
                border-radius: 20px;
            }
            .tool-btn {
                font-size: 0.55rem;
                padding: 2px 6px;
            }
            #info,
            #controls,
            #ocean-controls {
                display: none;
            }
            #hud h1 {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <div id="loading">🌍 Loading Atlas Sphere...</div>

    <div id="canvas-container"></div>

    <div id="hud">
        <h1>🌍 Atlas · 3D Sphere World</h1>
        <div class="sub">real-time 3D · globe · simulations</div>
    </div>

    <div id="info">
        <div class="row">
            <div class="label">Selected</div>
            <div class="value" id="selected-label">—</div>
        </div>
        <div class="row">
            <div class="label">Ocean</div>
            <div class="value ocean-data" id="ocean-state">🌊 calm</div>
        </div>
        <div class="row">
            <div class="label">Wave Height</div>
            <div class="value ocean-data" id="wave-height">0.5m</div>
        </div>
        <div class="row">
            <div class="label">Status</div>
            <div class="value sim-status" id="sim-status">● running</div>
        </div>
    </div>

    <div id="ocean-controls">
        <h4>🌊 OCEAN</h4>
        <div class="slider-label"><span>Height</span><span id="h-val">0.5</span></div>
        <input type="range" class="slider" id="height-slider" min="0" max="2" step="0.1" value="0.5" />
        <div class="slider-label" style="margin-top:4px;"><span>Speed</span><span id="s-val">1.0</span></div>
        <input type="range" class="slider" id="speed-slider" min="0.1" max="3" step="0.1" value="1.0" />
        <button style="width:100%;margin-top:6px;background:rgba(0,150,255,0.1);border:1px solid rgba(0,150,255,0.2);color:#4af;padding:3px;border-radius:12px;font-size:0.6rem;cursor:pointer;" id="toggle-ocean">⏸️ Pause</button>
        <button style="width:100%;margin-top:4px;background:rgba(0,150,255,0.1);border:1px solid rgba(0,150,255,0.2);color:#4af;padding:3px;border-radius:12px;font-size:0.6rem;cursor:pointer;" id="spin-btn">🔄 Auto-Spin</button>
    </div>

    <div id="controls">
        <h4>⚙️ SIMULATIONS</h4>
        <div class="toggle-item">
            <input type="checkbox" id="sim-traffic" checked />
            <label for="sim-traffic">🚗 Traffic</label>
            <span class="dot" id="dot-traffic"></span>
        </div>
        <div class="toggle-item">
            <input type="checkbox" id="sim-population" checked />
            <label for="sim-population">👥 Population</label>
            <span class="dot" id="dot-population"></span>
        </div>
        <div class="toggle-item">
            <input type="checkbox" id="sim-weather" />
            <label for="sim-weather">🌤️ Weather</label>
            <span class="dot" id="dot-weather"></span>
        </div>
        <div class="toggle-item">
            <input type="checkbox" id="sim-growth" />
            <label for="sim-growth">📈 Growth</label>
            <span class="dot" id="dot-growth"></span>
        </div>
    </div>

    <div id="toolbar">
        <button class="tool-btn active" data-tool="select">🔍 Select</button>
        <button class="tool-btn" data-tool="move">✋ Move</button>
        <button class="tool-btn" data-tool="place">➕ Place</button>
        <button class="tool-btn" data-tool="delete">🗑️ Delete</button>
        <button class="tool-btn primary" id="save-btn">💾 Save</button>
        <button class="tool-btn danger" id="reset-btn">↺ Reset</button>
        <button class="tool-btn sim" id="pause-sims">⏸️ Sims</button>
        <button class="tool-btn ocean active" id="ocean-btn">🌊 Ocean</button>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- SETUP ---
        const container = document.getElementById('canvas-container');
        document.getElementById('loading').style.display = 'none';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x05080f);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 40);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0';
        labelRenderer.domElement.style.left = '0';
        labelRenderer.domElement.style.pointerEvents = 'none';
        container.appendChild(labelRenderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.minDistance = 15;
        controls.maxDistance = 80;
        controls.target.set(0, 0, 0);

        // --- LIGHTING ---
        const ambient = new THREE.AmbientLight(0x223344, 0.5);
        scene.add(ambient);

        const sun = new THREE.DirectionalLight(0xffeedd, 1.0);
        sun.position.set(30, 40, 30);
        scene.add(sun);

        const sun2 = new THREE.DirectionalLight(0x4488ff, 0.3);
        sun2.position.set(-30, -20, -30);
        scene.add(sun2);

        const hemi = new THREE.HemisphereLight(0x445566, 0x221100, 0.6);
        scene.add(hemi);

        // --- STARFIELD ---
        const starsGeo = new THREE.BufferGeometry();
        const starCount = 3000;
        const starPos = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount * 3; i++) {
            starPos[i] = (Math.random() - 0.5) * 500;
        }
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starsMat = new THREE.PointsMaterial({
            color: 0xffffff,
            size: 0.3,
            transparent: true,
            opacity: 0.8,
        });
        const stars = new THREE.Points(starsGeo, starsMat);
        scene.add(stars);

        // --- SPHERE WORLD ---
        const sphereRadius = 12;
        const sphereGroup = new THREE.Group();
        scene.add(sphereGroup);

        // Atmosphere glow
        const glowGeo = new THREE.SphereGeometry(sphereRadius * 1.02, 64, 64);
        const glowMat = new THREE.ShaderMaterial({
            transparent: true,
            side: THREE.BackSide,
            uniforms: {
                time: { value: 0 },
            },
            vertexShader: `
                varying vec3 vNormal;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform float time;
                varying vec3 vNormal;
                void main() {
                    float intensity = pow(0.6 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 2.0);
                    vec3 color = mix(vec3(0.1, 0.3, 0.8), vec3(0.3, 0.6, 1.0), intensity);
                    gl_FragColor = vec4(color, intensity * 0.3);
                }
            `,
        });
        const glow = new THREE.Mesh(glowGeo, glowMat);
        sphereGroup.add(glow);

        // --- OCEAN SPHERE ---
        const oceanGeo = new THREE.SphereGeometry(sphereRadius * 0.99, 128, 128);

        const oceanMat = new THREE.ShaderMaterial({
            uniforms: {
                time: { value: 0 },
                waveHeight: { value: 0.15 },
                waveSpeed: { value: 1.0 },
            },
            vertexShader: `
                uniform float time;
                uniform float waveHeight;
                uniform float waveSpeed;
                varying float vHeight;
                varying vec3 vNormal;

                void main() {
                    vec3 pos = position;
                    float h = 0.0;
                    for(float i=0.0; i<8.0; i++){
                        float f = 2.0 + i*1.5;
                        float a = waveHeight * (0.3 + 0.7*sin(i*2.7 + time*0.1));
                        float s = waveSpeed * (0.5 + i*0.1);
                        float ang = i*1.7 + time*0.05;
                        vec2 d = vec2(cos(ang), sin(ang));
                        float w = sin(dot(pos.xz, d)*f + time*s);
                        h += w*a;
                    }
                    h *= 0.5;
                    pos += normalize(pos) * h;
                    vHeight = h;
                    vec3 n = normalize(position);
                    vNormal = n;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                }
            `,
            fragmentShader: `
                uniform float waveHeight;
                uniform float time;
                varying float vHeight;
                varying vec3 vNormal;

                void main() {
                    float h = vHeight / max(waveHeight, 0.01);
                    vec3 deep = vec3(0.0, 0.05, 0.15);
                    vec3 shallow = vec3(0.0, 0.3, 0.5);
                    vec3 color = mix(deep, shallow, 0.5 + h*0.5);

                    float foam = smoothstep(0.3, 0.7, h) * 0.4;
                    color += vec3(0.7, 0.8, 0.9) * foam;

                    // Fresnel
                    vec3 viewDir = normalize(cameraPosition - vNormal * 12.0);
                    float fresnel = pow(1.0 - max(dot(viewDir, vNormal), 0.0), 3.0);
                    color += vec3(0.3, 0.6, 0.9) * fresnel * 0.4;

                    // Specular
                    vec3 lightDir = normalize(vec3(1.0, 1.0, 1.0));
                    vec3 halfVec = normalize(lightDir + viewDir);
                    float spec = pow(max(dot(vNormal, halfVec), 0.0), 64.0);
                    color += vec3(1.0, 0.9, 0.7) * spec * 0.5;

                    gl_FragColor = vec4(color, 0.9);
                }
            `,
            transparent: true,
            side: THREE.DoubleSide,
        });

        const oceanSphere = new THREE.Mesh(oceanGeo, oceanMat);
        sphereGroup.add(oceanSphere);

        // --- LANDMASSES (Simplified as continents on sphere) ---
        const continentData = [
            { lat: 20, lon: -10, size: 3, color: 0x2d4a2d }, // Africa
            { lat: 45, lon: 10, size: 2.5, color: 0x3a5a3a }, // Europe
            { lat: 40, lon: -80, size: 3.5, color: 0x2a4a2a }, // N America
            { lat: -20, lon: -60, size: 2.5, color: 0x2d4a2d }, // S America
            { lat: 30, lon: 100, size: 3.5, color: 0x3a5a3a }, // Asia
            { lat: -25, lon: 135, size: 3, color: 0x2d4a2d }, // Australia
        ];

        function latLonToPos(lat, lon, radius) {
            const phi = (90 - lat) * Math.PI / 180;
            const theta = lon * Math.PI / 180;
            return new THREE.Vector3(
                radius * Math.sin(phi) * Math.cos(theta),
                radius * Math.cos(phi),
                radius * Math.sin(phi) * Math.sin(theta)
            );
        }

        continentData.forEach(c => {
            const pos = latLonToPos(c.lat, c.lon, sphereRadius * 0.98);
            const continent = new THREE.Mesh(
                new THREE.SphereGeometry(c.size * 0.3, 12, 12),
                new THREE.MeshStandardMaterial({
                    color: c.color,
                    roughness: 0.7,
                    metalness: 0.1,
                })
            );
            continent.position.copy(pos);
            // Flatten slightly on sphere surface
            continent.scale.set(1, 0.15, 1);
            continent.lookAt(new THREE.Vector3(0, 0, 0));
            sphereGroup.add(continent);
        });

        // --- LANDMARKS ON SPHERE ---
        const landmarkPositions = [
            { name: 'Eiffel Tower', lat: 48.8584, lon: 2.2945, color: 0x7a5a3a, height: 0.8 },
            { name: 'Statue Liberty', lat: 40.6892, lon: -74.0445, color: 0x6a9a6a, height: 0.6 },
            { name: 'Big Ben', lat: 51.5007, lon: -0.1246, color: 0x8a7a5a, height: 0.7 },
            { name: 'Colosseum', lat: 41.8902, lon: 12.4922, color: 0x9a7a5a, height: 0.5 },
            { name: 'Opera House', lat: -33.8568, lon: 151.2153, color: 0x7a9aaa, height: 0.6 },
            { name: 'Taj Mahal', lat: 27.1751, lon: 78.0421, color: 0xdaaa7a, height: 0.8 },
            { name: 'Pyramid', lat: 29.9792, lon: 31.1342, color: 0x8a7a5a, height: 0.9 },
            { name: 'Burj Khalifa', lat: 25.1972, lon: 55.2744, color: 0x6a8a9a, height: 1.0 },
            { name: 'Tokyo Tower', lat: 35.6586, lon: 139.7454, color: 0xcc5533, height: 0.7 },
            { name: 'Sydney Harbour', lat: -33.8547, lon: 151.2117, color: 0x4a8a9a, height: 0.5 },
        ];

        const objects = [];
        const labels = [];

        function createLandmarkOnSphere(data) {
            const pos = latLonToPos(data.lat, data.lon, sphereRadius * 0.98);
            const g = new THREE.Group();
            const h = data.height;
            const col = new THREE.Color(data.color);

            // Base
            const base = new THREE.Mesh(
                new THREE.CylinderGeometry(0.25, 0.3, 0.08, 6),
                new THREE.MeshStandardMaterial({ color: col, roughness: 0.5, metalness: 0.2 })
            );
            base.position.y = 0.04;
            g.add(base);

            // Body
            const body = new THREE.Mesh(
                new THREE.CylinderGeometry(0.08, 0.15, h, 6),
                new THREE.MeshStandardMaterial({ color: col, roughness: 0.4, metalness: 0.3 })
            );
            body.position.y = 0.08 + h / 2;
            g.add(body);

            // Top
            const top = new THREE.Mesh(
                new THREE.SphereGeometry(0.05, 6, 6),
                new THREE.MeshStandardMaterial({
                    color: 0xffaa44,
                    emissive: 0xff5500,
                    emissiveIntensity: 0.3
                })
            );
            top.position.y = 0.08 + h + 0.05;
            g.add(top);

            g.position.copy(pos);
            // Orient to sphere surface
            g.lookAt(new THREE.Vector3(0, 0, 0));
            g.rotateX(Math.PI / 2);

            g.userData = {
                name: data.name,
                lat: data.lat,
                lon: data.lon,
                height: h,
                color: data.color
            };
            sphereGroup.add(g);
            objects.push(g);

            // Label
            const labelPos = latLonToPos(data.lat, data.lon, sphereRadius * 1.15);
            const div = document.createElement('div');
            div.textContent = data.name;
            div.style.cssText =
                'color:#dde;font-size:10px;font-weight:400;text-shadow:0 2px 20px rgba(0,0,0,0.9);background:rgba(10,14,23,0.5);padding:2px 10px;border-radius:10px;backdrop-filter:blur(4px);border:1px solid rgba(255,255,255,0.05);pointer-events:none;white-space:nowrap;';
            const label = new CSS2DObject(div);
            label.position.copy(labelPos);
            sphereGroup.add(label);
            labels.push(label);

            return { group: g, label: label };
        }

        landmarkPositions.forEach(data => createLandmarkOnSphere(data));

        // --- SIMULATION ENGINE ---
        const sim = {
            traffic: { enabled: true, data: {} },
            population: { enabled: true, data: {} },
            weather: { enabled: false, data: {} },
            growth: { enabled: false, data: {} },
            paused: false,
            time: 0,
            autoSpin: false,
            spinSpeed: 0.002,
            landmarkData: landmarkPositions.map(l => ({
                ...l,
                pop: 100 + Math.random() * 900,
                traffic: 10 + Math.random() * 90,
                height: l.height,
            })),

            update(dt) {
                if (this.paused) return;
                this.time += dt;

                if (this.traffic.enabled) {
                    this.landmarkData.forEach((l, i) => {
                        l.traffic = 20 + 60 * (0.5 + 0.5 * Math.sin(i + this.time * 0.08));
                    });
                    this.traffic.data.avg = this.landmarkData.reduce((s, l) => s + l.traffic, 0) / this.landmarkData
                    .length;
                }

                if (this.population.enabled) {
                    this.landmarkData.forEach((l) => {
                        l.pop += l.pop * 0.001 * (1 - l.pop / 3000) * dt * 10;
                        l.pop = Math.max(50, Math.min(3500, l.pop));
                    });
                    this.population.data.total = this.landmarkData.reduce((s, l) => s + l.pop, 0);
                }

                if (this.growth.enabled) {
                    this.landmarkData.forEach((l, i) => {
                        l.height += 0.0005 * dt * 5;
                        l.height = Math.min(2.0, l.height);
                        // Update 3D object
                        if (objects[i]) {
                            const body = objects[i].children[1];
                            if (body) {
                                body.scale.y = l.height / landmarkPositions[i].height;
                                body.position.y = 0.08 + l.height / 2;
                            }
                            const top = objects[i].children[2];
                            if (top) {
                                top.position.y = 0.08 + l.height + 0.05;
                            }
                        }
                    });
                    this.growth.data.avgHeight = this.landmarkData.reduce((s, l) => s + l.height, 0) / this.landmarkData
                        .length;
                }

                // Auto-spin
                if (this.autoSpin) {
                    sphereGroup.rotation.y += this.spinSpeed;
                }
            },

            toggle(name) {
                this[name].enabled = !this[name].enabled;
                return this[name].enabled;
            },

            togglePause() {
                this.paused = !this.paused;
                return this.paused;
            },

            toggleSpin() {
                this.autoSpin = !this.autoSpin;
                return this.autoSpin;
            },

            reset() {
                this.landmarkData.forEach((l, i) => {
                    l.pop = 100 + Math.random() * 900;
                    l.traffic = 10 + Math.random() * 90;
                    l.height = landmarkPositions[i].height;
                    if (objects[i]) {
                        const body = objects[i].children[1];
                        if (body) body.scale.y = 1;
                        const top = objects[i].children[2];
                        if (top) top.position.y = 0.08 + l.height + 0.05;
                    }
                });
                this.time = 0;
                sphereGroup.rotation.set(0, 0, 0);
            }
        };

        // --- INTERACTION ---
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let selected = null;
        let tool = 'select';

        renderer.domElement.addEventListener('click', (e) => {
            const rect = renderer.domElement.getBoundingClientRect();
            pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);

            const meshes = [];
            objects.forEach(g => g.children.forEach(c => { if (c.isMesh) meshes.push(c); }));
            const hits = raycaster.intersectObjects(meshes);
            if (hits.length > 0) {
                let g = hits[0].object.parent;
                while (g && !objects.includes(g)) g = g.parent;
                if (g) {
                    document.getElementById('selected-label').textContent = g.userData.name || 'Landmark';
                    selected = g;
                    return;
                }
            }
            document.getElementById('selected-label').textContent = '—';
            selected = null;
        });

        // --- UI CONTROLS ---
        document.querySelectorAll('[data-tool]').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('[data-tool]').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                tool = btn.dataset.tool;
            });
        });

        document.getElementById('height-slider').addEventListener('input', (e) => {
            const v = parseFloat(e.target.value);
            document.getElementById('h-val').textContent = v.toFixed(1);
            oceanSphere.material.uniforms.waveHeight.value = v * 0.15;
            document.getElementById('wave-height').textContent = (v * 0.3).toFixed(1) + 'm';
            const state = v < 0.3 ? '🌊 calm' : v < 0.6 ? '🌊 moderate' : v < 1.2 ? '🌊 rough' : '🌊 stormy';
            document.getElementById('ocean-state').textContent = state;
        });

        document.getElementById('speed-slider').addEventListener('input', (e) => {
            const v = parseFloat(e.target.value);
            document.getElementById('s-val').textContent = v.toFixed(1);
            oceanSphere.material.uniforms.waveSpeed.value = v;
        });

        document.getElementById('toggle-ocean').addEventListener('click', () => {
            oceanSphere.visible = !oceanSphere.visible;
            document.getElementById('toggle-ocean').textContent = oceanSphere.visible ? '⏸️ Pause' : '▶️ Play';
        });

        document.getElementById('ocean-btn').addEventListener('click', () => {
            oceanSphere.visible = !oceanSphere.visible;
            document.getElementById('ocean-btn').classList.toggle('active');
        });

        document.getElementById('spin-btn').addEventListener('click', () => {
            const spinning = sim.toggleSpin();
            document.getElementById('spin-btn').textContent = spinning ? '⏸️ Stop Spin' : '🔄 Auto-Spin';
        });

        document.getElementById('pause-sims').addEventListener('click', () => {
            const paused = sim.togglePause();
            document.getElementById('pause-sims').textContent = paused ? '▶️ Sims' : '⏸️ Sims';
            document.getElementById('sim-status').textContent = paused ? '● paused' : '● running';
        });

        ['traffic', 'population', 'weather', 'growth'].forEach(name => {
            document.getElementById(`sim-${name}`).addEventListener('change', (e) => {
                sim.toggle(name);
                document.getElementById(`dot-${name}`).className = 'dot' + (e.target.checked ? '' : ' paused');
            });
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            sim.reset();
            document.getElementById('height-slider').value = 0.5;
            document.getElementById('h-val').textContent = '0.5';
            oceanSphere.material.uniforms.waveHeight.value = 0.075;
            document.getElementById('wave-height').textContent = '0.2m';
            document.getElementById('ocean-state').textContent = '🌊 calm';
            sphereGroup.rotation.set(0, 0, 0);
        });

        document.getElementById('save-btn').addEventListener('click', () => {
            const data = sim.landmarkData.map(l => ({
                name: l.name,
                lat: l.lat,
                lon: l.lon,
                population: Math.round(l.pop),
                traffic: Math.round(l.traffic),
                height: l.height.toFixed(2)
            }));
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'atlas_sphere_data.json';
            a.click();
        });

        // --- ANIMATION ---
        let lastTime = 0;

        function animate(time) {
            const dt = Math.min((time - lastTime) / 1000, 0.05);
            lastTime = time;

            // Update ocean
            oceanSphere.material.uniforms.time.value += dt * oceanSphere.material.uniforms.waveSpeed.value;
            glow.material.uniforms.time.value += dt;

            // Update sims
            sim.update(dt);

            // Rotate stars slowly
            stars.rotation.y += dt * 0.002;

            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        // --- RESIZE ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate(0);

        console.log('🌍 Atlas Sphere Ready!');
        console.log('🏛️ ' + objects.length + ' landmarks on sphere');
        console.log('🌊 Dynamic ocean with ' + oceanGeo.attributes.position.count + ' vertices');
    </script>
</body>
</html>
