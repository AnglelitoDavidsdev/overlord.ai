<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas - Ocean & Simulation Engine</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0b0e14;
            color: #e8edf5;
            overflow: hidden;
            height: 100vh;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            z-index: 10;
        }
        #hud h1 {
            font-weight: 300;
            font-size: 1.5rem;
            letter-spacing: 2px;
            background: rgba(11, 14, 20, 0.7);
            padding: 8px 18px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: inline-block;
        }
        #hud .sub {
            font-size: 0.75rem;
            opacity: 0.6;
            margin-top: 6px;
            padding-left: 10px;
            letter-spacing: 1px;
        }

        #toolbar {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            background: rgba(18, 22, 30, 0.85);
            backdrop-filter: blur(16px);
            padding: 10px 16px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            pointer-events: auto;
            z-index: 20;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 98vw;
        }
        .tool-btn {
            background: transparent;
            border: none;
            color: #aab;
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.3px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            white-space: nowrap;
        }
        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.1);
        }
        .tool-btn.active {
            background: #2a7de1;
            color: white;
            box-shadow: 0 0 20px rgba(42, 125, 225, 0.3);
            border-color: #2a7de1;
        }
        .tool-btn.primary {
            background: #1f8b4c;
            color: white;
        }
        .tool-btn.primary:hover {
            background: #28a85e;
        }
        .tool-btn.danger {
            background: #b13e3e;
            color: white;
        }
        .tool-btn.danger:hover {
            background: #d14a4a;
        }
        .tool-btn.ocean-btn {
            background: rgba(0, 150, 255, 0.15);
            color: #4af;
            border-color: rgba(0, 150, 255, 0.2);
        }
        .tool-btn.ocean-btn:hover {
            background: rgba(0, 150, 255, 0.25);
        }
        .tool-btn.ocean-btn.active {
            background: #0077be;
            color: white;
            box-shadow: 0 0 20px rgba(0, 119, 190, 0.3);
            border-color: #0077be;
        }
        .tool-btn.sim-btn {
            background: rgba(42, 125, 225, 0.15);
            color: #6af;
            border-color: rgba(42, 125, 225, 0.2);
        }
        .tool-btn.sim-btn:hover {
            background: rgba(42, 125, 225, 0.25);
        }
        .tool-btn.sim-active {
            background: #e17d2a;
            color: white;
            box-shadow: 0 0 20px rgba(225, 125, 42, 0.3);
            border-color: #e17d2a;
        }

        #info-panel {
            position: absolute;
            bottom: 120px;
            right: 20px;
            background: rgba(11, 14, 20, 0.85);
            backdrop-filter: blur(12px);
            padding: 14px 18px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.75rem;
            min-width: 160px;
            pointer-events: none;
            z-index: 15;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        #info-panel .label {
            opacity: 0.4;
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #info-panel .value {
            font-size: 0.85rem;
            font-weight: 400;
            margin-top: 2px;
        }
        #info-panel .row {
            margin-bottom: 6px;
        }
        #info-panel .row:last-child {
            margin-bottom: 0;
        }
        .ocean-data {
            color: #4af;
        }
        .sim-status {
            color: #6f8;
        }

        #sim-controls {
            position: absolute;
            top: 80px;
            right: 20px;
            background: rgba(11, 14, 20, 0.85);
            backdrop-filter: blur(12px);
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            z-index: 15;
            min-width: 150px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
        }
        #sim-controls h4 {
            font-weight: 400;
            font-size: 0.7rem;
            opacity: 0.6;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .sim-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
            cursor: pointer;
            transition: 0.2s;
            border-radius: 6px;
            padding: 4px 8px;
        }
        .sim-toggle:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .sim-toggle input[type="checkbox"] {
            accent-color: #2a7de1;
            width: 14px;
            height: 14px;
            cursor: pointer;
        }
        .sim-toggle label {
            font-size: 0.7rem;
            cursor: pointer;
            flex: 1;
        }
        .sim-toggle .indicator {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #4a4;
            transition: 0.3s;
        }
        .sim-toggle .indicator.paused {
            background: #a44;
        }

        #ocean-controls {
            position: absolute;
            top: 80px;
            left: 20px;
            background: rgba(11, 14, 20, 0.85);
            backdrop-filter: blur(12px);
            padding: 14px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            z-index: 15;
            min-width: 140px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
        }
        #ocean-controls h4 {
            font-weight: 400;
            font-size: 0.7rem;
            opacity: 0.6;
            margin-bottom: 8px;
            letter-spacing: 1px;
            color: #4af;
        }
        .ocean-slider {
            width: 100%;
            margin: 4px 0;
            accent-color: #0077be;
            height: 4px;
        }
        .ocean-slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.6rem;
            opacity: 0.5;
        }
        .ocean-control-btn {
            background: rgba(0, 150, 255, 0.1);
            border: 1px solid rgba(0, 150, 255, 0.2);
            color: #4af;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.65rem;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 6px;
            width: 100%;
        }
        .ocean-control-btn:hover {
            background: rgba(0, 150, 255, 0.2);
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #aab;
            font-size: 0.9rem;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 24px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            z-index: 5;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        @media (max-width: 700px) {
            #toolbar {
                bottom: 10px;
                padding: 6px 10px;
                gap: 3px;
                border-radius: 20px;
                width: 98%;
            }
            .tool-btn {
                font-size: 0.6rem;
                padding: 3px 8px;
            }
            #info-panel,
            #sim-controls,
            #ocean-controls {
                display: none;
            }
            #hud h1 {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <div id="loading">🌊 Initializing Atlas Ocean Simulation...</div>

    <div id="canvas-container"></div>

    <div id="hud">
        <h1>🌊 Atlas · Ocean Engine</h1>
        <div class="sub">real-time 3D · dynamic waves · multi-simulation</div>
    </div>

    <div id="info-panel">
        <div class="row">
            <div class="label">Selected</div>

        </div>
        <div class="row">

        </div>
        <div class="row">
            <div class="label">Ocean State</div>

        <input type="range" class="ocean-slider" id="wave-height-slider" min="0" max="2" step="0.1" value="0.5" />
        <div class="ocean-slider-label" style="margin-top:6px;">
            <span>Speed</span>

    <div id="toolbar">

        <button class="tool-btn primary" id="save-btn">💾 Save</button>

        <button class="tool-btn ocean-btn active" id="toggle-ocean-btn2">🌊 Ocean</button>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- SIMULATION ENGINE ---
        class SimulationEngine {
            constructor() {
                this.simulations = {
                    traffic: { enabled: true, data: {}, tick: 0 },
                    population: { enabled: true, data: {}, tick: 0 },
                    weather: { enabled: false, data: {}, tick: 0 },
                    growth: { enabled: false, data: {}, tick: 0 }
                };
                this.paused = false;
                this.simTime = 0;
                this.landmarkData = [];
                this.history = [];
            }

            initialize(landmarks) {
                this.landmarkData = landmarks.map(l => ({
                    ...l,
                    population: 100 + Math.random() * 900,
                    traffic: 10 + Math.random() * 90,
                    growth: 0.5 + Math.random() * 2,
                    weather: 'clear',
                    temperature: 15 + Math.random() * 20,
                    originalHeight: l.height || 3,
                }));
            }

            update(deltaTime) {
                if (this.paused) return;
                this.simTime += deltaTime;
                const sims = this.simulations;

                if (sims.traffic.enabled) {
                    sims.traffic.tick += deltaTime;
                    this.landmarkData.forEach((l, i) => {
                        const timeOfDay = (this.simTime % 3600) / 3600;
                        const peakFactor = 1 + 0.8 * Math.sin(timeOfDay * Math.PI * 2);
                        l.traffic = 20 + 70 * (0.5 + 0.5 * Math.sin(i + this.simTime * 0.1)) * peakFactor;
                        l.traffic = Math.max(5, Math.min(100, l.traffic));
                    });
                    sims.traffic.data = {
                        avgTraffic: this.landmarkData.reduce((s, l) => s + l.traffic, 0) / this.landmarkData.length,
                        peak: Math.max(...this.landmarkData.map(l => l.traffic))
                    };
                }

                if (sims.population.enabled) {
                    sims.population.tick += deltaTime;
                    this.landmarkData.forEach((l) => {
                        const growthRate = 0.001 + (l.growth || 1) * 0.002;
                        const carryingCapacity = 2000 + Math.random() * 3000;
                        const noise = 1 + 0.02 * Math.sin(this.simTime * 0.05 + l.pos[0]);
                        l.population += l.population * growthRate * (1 - l.population / carryingCapacity) * noise *
                            deltaTime * 10;
                        l.population = Math.max(50, Math.min(carryingCapacity * 1.1, l.population));
                    });
                    sims.population.data = {
                        total: this.landmarkData.reduce((s, l) => s + l.population, 0),
                        avg: this.landmarkData.reduce((s, l) => s + l.population, 0) / this.landmarkData.length
                    };
                }

                if (sims.weather.enabled) {
                    sims.weather.tick += deltaTime;
                    this.landmarkData.forEach((l) => {
                        const weatherTypes = ['clear', 'cloudy', 'rain', 'storm', 'fog'];
                        const tempBase = 15 + 10 * Math.sin(this.simTime * 0.0003 + l.pos[0] * 0.1);
                        l.temperature = tempBase + 5 * Math.sin(this.simTime * 0.0005 + l.pos[2] * 0.1);
                        if (Math.random() < 0.001) {
                            l.weather = weatherTypes[Math.floor(Math.random() * weatherTypes.length)];
                        }
                    });
                    sims.weather.data = {
                        avgTemp: this.landmarkData.reduce((s, l) => s + l.temperature, 0) / this.landmarkData.length,
                        conditions: [...new Set(this.landmarkData.map(l => l.weather))]
                    };
                }

                if (sims.growth.enabled) {
                    sims.growth.tick += deltaTime;
                    this.landmarkData.forEach((l) => {
                        const growthFactor = 0.001 + (l.growth || 1) * 0.003;
                        const heightGrowth = growthFactor * deltaTime * 5;
                        l.height += heightGrowth;
                        l.height = Math.min(20, l.height);
                        l.population += l.population * growthFactor * deltaTime * 20;
                    });
                    sims.growth.data = {
                        avgHeight: this.landmarkData.reduce((s, l) => s + l.height, 0) / this.landmarkData.length,
                        totalGrowth: this.landmarkData.reduce((s, l) => s + l.height - (l.originalHeight || 3), 0)
                    };
                }
            }

            getLandmarkData() {
                return this.landmarkData;
            }

            togglePause() {
                this.paused = !this.paused;
                return this.paused;
            }

            toggleSim(name) {
                if (this.simulations[name]) {
                    this.simulations[name].enabled = !this.simulations[name].enabled;
                    return this.simulations[name].enabled;
                }
                return false;
            }

            reset() {
                this.landmarkData.forEach(l => {
                    l.population = 100 + Math.random() * 900;
                    l.traffic = 10 + Math.random() * 90;
                    l.height = l.originalHeight || 3;
                    l.temperature = 15 + Math.random() * 20;
                    l.weather = 'clear';
                });
                this.simTime = 0;
                this.history = [];
                Object.keys(this.simulations).forEach(key => {
                    this.simulations[key].tick = 0;
                    this.simulations[key].data = {};
                });
            }
        }

        // --- OCEAN SYSTEM ---
        class OceanSystem {
            constructor(scene) {
                this.scene = scene;
                this.waveHeight = 0.5;
                this.waveSpeed = 1.0;
                this.foamIntensity = 0.5;
                this.enabled = true;
                this.time = 0;
                this.segments = 128;

                this.createOcean();
                this.createParticles();
                this.createSkyDome();
            }

            createOcean() {
                const geometry = new THREE.PlaneGeometry(200, 200, this.segments, this.segments);
                geometry.rotateX(-Math.PI / 2);

                const material = new THREE.ShaderMaterial({
                    uniforms: {
                        time: { value: 0 },
                        waveHeight: { value: this.waveHeight },
                        waveSpeed: { value: this.waveSpeed },
                        foamIntensity: { value: this.foamIntensity },
                        waterColor: { value: new THREE.Color(0x006994) },
                        deepColor: { value: new THREE.Color(0x001a33) },
                        foamColor: { value: new THREE.Color(0xffffff) },
                    },
                    vertexShader: `
                        uniform float time;
                        uniform float waveHeight;
                        uniform float waveSpeed;

                        varying float vHeight;
                        varying vec2 vUv;
                        varying vec3 vNormal;

                        void main() {
                            vUv = uv;
                            vec3 pos = position;

                            float h = 0.0;
                            for (float i = 0.0; i < 8.0; i++) {
                                float freq = 0.5 + i * 0.3;
                                float amp = waveHeight * (0.5 + 0.5 * sin(i * 1.7));
                                float speed = waveSpeed * (0.8 + i * 0.1);
                                float angle = i * 1.2 + 0.5;
                                vec2 dir = vec2(cos(angle), sin(angle));
                                float wave = sin(dot(pos.xz, dir) * freq + time * speed);
                                h += wave * amp;
                            }
                            h /= 2.0;
                            pos.y += h;
                            vHeight = h;

                            float eps = 0.1;
                            float hx = 0.0;
                            float hz = 0.0;
                            for (float i = 0.0; i < 8.0; i++) {
                                float freq = 0.5 + i * 0.3;
                                float amp = waveHeight * (0.5 + 0.5 * sin(i * 1.7));
                                float speed = waveSpeed * (0.8 + i * 0.1);
                                float angle = i * 1.2 + 0.5;
                                vec2 dir = vec2(cos(angle), sin(angle));
                                float wave = sin(dot(pos.xz, dir) * freq + time * speed);
                                hx += wave * amp * freq * dir.x;
                                hz += wave * amp * freq * dir.y;
                            }
                            hx /= 2.0;
                            hz /= 2.0;
                            vec3 normal = normalize(vec3(-hx, 1.0, -hz));
                            vNormal = normal;

                            gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
                        }
                    `,
                    fragmentShader: `
                        uniform vec3 waterColor;
                        uniform vec3 deepColor;
                        uniform vec3 foamColor;
                        uniform float foamIntensity;
                        uniform float waveHeight;

                        varying float vHeight;
                        varying vec2 vUv;
                        varying vec3 vNormal;

                        void main() {
                            vec3 viewDir = vec3(0.0, 1.0, 0.0);
                            float fresnel = 1.0 - max(dot(viewDir, vNormal), 0.0);
                            fresnel = pow(fresnel, 3.0);

                            float depthFactor = 0.5 + 0.5 * vHeight / max(waveHeight, 0.1);
                            vec3 color = mix(deepColor, waterColor, depthFactor);

                            float foam = smoothstep(0.3, 0.7, vHeight / max(waveHeight, 0.1));
                            foam *= foamIntensity;
                            color = mix(color, foamColor, foam * 0.5);

                            float spec = pow(max(dot(vNormal, viewDir), 0.0), 32.0);
                            color += vec3(1.0, 1.0, 0.8) * spec * 0.3;
                            color += vec3(0.4, 0.6, 0.8) * fresnel * 0.3;

                            gl_FragColor = vec4(color, 0.85);
                        }
                    `,
                    transparent: true,
                    side: THREE.DoubleSide,
                });

                this.oceanMesh = new THREE.Mesh(geometry, material);
                this.oceanMesh.position.y = -0.3;
                this.oceanMesh.receiveShadow = true;
                this.scene.add(this.oceanMesh);
            }

            createParticles() {
                const particleCount = 800;
                const geometry = new THREE.BufferGeometry();
                const positions = new Float32Array(particleCount * 3);
                const velocities = new Float32Array(particleCount * 3);

                for (let i = 0; i < particleCount; i++) {
                    positions[i * 3] = (Math.random() - 0.5) * 160;
                    positions[i * 3 + 1] = Math.random() * 2 - 0.5;
                    positions[i * 3 + 2] = (Math.random() - 0.5) * 160;
                    velocities[i * 3] = (Math.random() - 0.5) * 0.3;
                    velocities[i * 3 + 1] = Math.random() * 0.3 + 0.1;
                    velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.3;
                }

                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

                const material = new THREE.PointsMaterial({
                    color: 0x88ccff,
                    size: 0.2,
                    transparent: true,
                    opacity: 0.3,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                });

                this.particles = new THREE.Points(geometry, material);
                this.scene.add(this.particles);
                this.particleVelocities = velocities;
            }

            createSkyDome() {
                const skyGeo = new THREE.SphereGeometry(150, 32, 32);
                const skyMat = new THREE.ShaderMaterial({
                    uniforms: {
                        time: { value: 0 },
                    },
                    vertexShader: `
                        varying vec3 vPosition;
                        void main() {
                            vPosition = position;
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                        }
                    `,
                    fragmentShader: `
                        uniform float time;
                        varying vec3 vPosition;

                        void main() {
                            vec3 pos = normalize(vPosition);

            update(delta) {
                if (!this.enabled) return;
                this.time += delta * this.waveSpeed;

                if (this.oceanMesh) {
                    this.oceanMesh.material.uniforms.time.value = this.time;
                    this.oceanMesh.material.uniforms.waveHeight.value = this.waveHeight;
                    this.oceanMesh.material.uniforms.waveSpeed.value = this.waveSpeed;
                    this.oceanMesh.material.uniforms.foamIntensity.value = this.foamIntensity;
                }

                if (this.skySphere) {
                    this.skySphere.material.uniforms.time.value = this.time;
                    this.skySphere.rotation.y += delta * 0.001;
                }

                if (this.particles) {
                    const positions = this.particles.geometry.attributes.position.array;
                    for (let i = 0; i < positions.length / 3; i++) {
                        const x = positions[i * 3];
                        const z = positions[i * 3 + 2];
                        const waveHeight = this.waveHeight * 0.5;
                        const wave = Math.sin(x * 0.3 + this.time * 0.5) * Math.cos(z * 0.2 + this.time * 0.3) * waveHeight;

                        positions[i * 3 + 1] += this.particleVelocities[i * 3 + 1] * delta * 0.5;

                        if (positions[i * 3 + 1] > 2 + wave || positions[i * 3 + 1] < -1) {
                            positions[i * 3] = (Math.random() - 0.5) * 160;
                            positions[i * 3 + 1] = -0.5 + Math.random() * 0.5;
                            positions[i * 3 + 2] = (Math.random() - 0.5) * 160;
                            this.particleVelocities[i * 3 + 1] = Math.random() * 0.3 + 0.1;
                        }

                        positions[i * 3] += this.particleVelocities[i * 3] * delta * 0.2;
                        positions[i * 3 + 2] += this.particleVelocities[i * 3 + 2] * delta * 0.2;
                    }
                    this.particles.geometry.attributes.position.needsUpdate = true;
                    this.particles.material.opacity = 0.15 + this.foamIntensity * 0.25;
                }

                // Update UI
                const state = this.getOceanState();
                document.getElementById('ocean-state').textContent = state.emoji + ' ' + state.text;
                document.getElementById('wave-height').textContent = (this.waveHeight * 2).toFixed(1) + ' m';
            }

            getOceanState() {
                const h = this.waveHeight;
                if (h < 0.3) return { emoji: '🌊', text: 'calm' };
                if (h < 0.6) return { emoji: '🌊', text: 'moderate' };
                if (h < 1.2) return { emoji: '🌊', text: 'rough' };
                return { emoji: '🌊', text: 'stormy' };
            }

                this.enabled = !this.enabled;
                if (this.oceanMesh) this.oceanMesh.visible = this.enabled;
