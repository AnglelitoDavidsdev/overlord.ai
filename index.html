<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas - Real-time 3D World Editor + Simulations</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0b0e14;
            color: #e8edf5;
            overflow: hidden;
            height: 100vh;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        /* HUD Overlay */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            z-index: 10;
        }
        #hud h1 {
            font-weight: 300;
            font-size: 1.5rem;
            letter-spacing: 2px;
            background: rgba(11, 14, 20, 0.7);
            padding: 8px 18px;
            border-radius: 30px;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: inline-block;
        }
        #hud .sub {
            font-size: 0.75rem;
            opacity: 0.6;
            margin-top: 6px;
            padding-left: 10px;
            letter-spacing: 1px;
        }

        #toolbar {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            background: rgba(18, 22, 30, 0.85);
            backdrop-filter: blur(16px);
            padding: 12px 20px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            pointer-events: auto;
            z-index: 20;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 95vw;
        }
        .tool-btn {
            background: transparent;
            border: none;
            color: #aab;
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.3px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid transparent;
            white-space: nowrap;
        }
        .tool-btn:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border-color: rgba(255, 255, 255, 0.1);
        }
        .tool-btn.active {
            background: #2a7de1;
            color: white;
            box-shadow: 0 0 20px rgba(42, 125, 225, 0.3);
            border-color: #2a7de1;
        }
        .tool-btn.sim-active {
            background: #e17d2a;
            color: white;
            box-shadow: 0 0 20px rgba(225, 125, 42, 0.3);
            border-color: #e17d2a;
        }
        .tool-btn.primary {
            background: #1f8b4c;
            color: white;
        }
        .tool-btn.primary:hover {
            background: #28a85e;
        }
        .tool-btn.danger {
            background: #b13e3e;
            color: white;
        }
        .tool-btn.danger:hover {
            background: #d14a4a;
        }
        .tool-btn.sim-btn {
            background: rgba(42, 125, 225, 0.15);
            color: #6af;
            border-color: rgba(42, 125, 225, 0.2);
        }
        .tool-btn.sim-btn:hover {
            background: rgba(42, 125, 225, 0.25);
        }

        #info-panel {
            position: absolute;
            bottom: 120px;
            right: 30px;
            background: rgba(11, 14, 20, 0.8);
            backdrop-filter: blur(12px);
            padding: 18px 22px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.8rem;
            min-width: 200px;
            pointer-events: none;
            z-index: 15;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            max-height: 60vh;
            overflow-y: auto;
        }
        #info-panel .label {
            opacity: 0.5;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #info-panel .value {
            font-size: 0.95rem;
            font-weight: 400;
            margin-top: 4px;
            font-variant-numeric: tabular-nums;
        }
        #info-panel .row {
            margin-bottom: 8px;
        }
        #info-panel .row:last-child {
            margin-bottom: 0;
        }
        #info-panel .sim-status {
            color: #6f8;
        }
        #info-panel .sim-data {
            font-size: 0.75rem;
            opacity: 0.8;
            margin-top: 2px;
        }

        #sim-controls {
            position: absolute;
            top: 80px;
            right: 30px;
            background: rgba(11, 14, 20, 0.8);
            backdrop-filter: blur(12px);
            padding: 16px 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            z-index: 15;
            min-width: 180px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            pointer-events: auto;
        }
        #sim-controls h4 {
            font-weight: 400;
            font-size: 0.8rem;
            opacity: 0.7;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .sim-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 0;
            cursor: pointer;
            transition: 0.2s;
            border-radius: 8px;
            padding: 6px 10px;
        }
        .sim-toggle:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .sim-toggle input[type="checkbox"] {
            accent-color: #2a7de1;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .sim-toggle label {
            font-size: 0.75rem;
            cursor: pointer;
            flex: 1;
        }
        .sim-toggle .indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4a4;
            transition: 0.3s;
        }
        .sim-toggle .indicator.paused {
            background: #a44;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #aab;
            font-size: 0.9rem;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 24px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            z-index: 5;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Scrollbar */
        #info-panel::-webkit-scrollbar {
            width: 4px;
        }
        #info-panel::-webkit-scrollbar-track {
            background: transparent;
        }
        #info-panel::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        @media (max-width: 700px) {
            #toolbar {
                bottom: 20px;
                padding: 8px 12px;
                gap: 4px;
                border-radius: 30px;
                width: 98%;
            }
            .tool-btn {
                font-size: 0.65rem;
                padding: 4px 10px;
            }
            #info-panel, #sim-controls {
                display: none;
            }
            #hud h1 {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <div id="loading">Initializing Atlas Simulation Engine...</div>

    <div id="canvas-container"></div>

    <div id="hud">
        <h1>🌍 Atlas · Simulation Engine</h1>
        <div class="sub">real-time 3D · multi-simulation · interactive</div>
    </div>

    <div id="info-panel">
        <div class="row">
            <div class="label">Selected</div>
            <div class="value" id="selected-label">—</div>
        </div>
        <div class="row">
            <div class="label">Coordinates</div>
            <div class="value" id="coord-label">—</div>
        </div>
        <div class="row">
            <div class="label">Simulation</div>
            <div class="value sim-status" id="sim-status">● idle</div>
        </div>
        <div class="row">
            <div class="label">Active Sims</div>
            <div class="value sim-data" id="sim-count">0 / 4</div>
        </div>
        <div class="row">
            <div class="label">Sim Data</div>
            <div class="value sim-data" id="sim-data">—</div>
        </div>
    </div>

    <div id="sim-controls">
        <h4>⚙️ SIMULATION CONTROLS</h4>
        <div class="sim-toggle">
            <input type="checkbox" id="sim-traffic" checked />
            <label for="sim-traffic">🚗 Traffic Flow</label>
            <span class="indicator" id="ind-traffic"></span>
        </div>
        <div class="sim-toggle">
            <input type="checkbox" id="sim-population" checked />
            <label for="sim-population">👥 Population</label>
            <span class="indicator" id="ind-population"></span>
        </div>
        <div class="sim-toggle">
            <input type="checkbox" id="sim-weather" />
            <label for="sim-weather">🌤️ Weather</label>
            <span class="indicator" id="ind-weather"></span>
        </div>
        <div class="sim-toggle">
            <input type="checkbox" id="sim-growth" />
            <label for="sim-growth">📈 Urban Growth</label>
            <span class="indicator" id="ind-growth"></span>
        </div>
        <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;">
            <button class="tool-btn primary" id="sim-reset" style="font-size:0.7rem;padding:4px 12px;">↺ Reset Sims</button>
            <button class="tool-btn" id="sim-export" style="font-size:0.7rem;padding:4px 12px;">📊 Export Data</button>
        </div>
    </div>

    <div id="toolbar">
        <button class="tool-btn active" data-tool="select">🔍 Select</button>
        <button class="tool-btn" data-tool="move">✋ Move</button>
        <button class="tool-btn" data-tool="place">➕ Place</button>
        <button class="tool-btn" data-tool="delete">🗑️ Delete</button>
        <button class="tool-btn primary" id="save-btn">💾 Save</button>
        <button class="tool-btn danger" id="reset-btn">↺ Reset</button>
        <button class="tool-btn sim-btn" id="toggle-sim-btn">⏸️ Pause Sims</button>
    </div>

    <!-- Import maps and scripts -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- SIMULATION ENGINE ---
        class SimulationEngine {
            constructor() {
                this.simulations = {
                    traffic: { enabled: true, data: {}, tick: 0 },
                    population: { enabled: true, data: {}, tick: 0 },
                    weather: { enabled: false, data: {}, tick: 0 },
                    growth: { enabled: false, data: {}, tick: 0 }
                };
                this.paused = false;
                this.simTime = 0;
                this.landmarkData = [];
                this.history = [];
            }

            initialize(landmarks) {
                this.landmarkData = landmarks.map(l => ({
                    ...l,
                    population: 100 + Math.random() * 900,
                    traffic: 10 + Math.random() * 90,
                    growth: 0.5 + Math.random() * 2,
                    weather: 'clear',
                    temperature: 15 + Math.random() * 20
                }));
            }

            update(deltaTime) {
                if (this.paused) return;

                this.simTime += deltaTime;
                const sims = this.simulations;

                // Traffic Flow Simulation
                if (sims.traffic.enabled) {
                    sims.traffic.tick += deltaTime;
                    this.landmarkData.forEach((l, i) => {
                        // Simulate traffic based on time of day and location
                        const timeOfDay = (this.simTime % 3600) / 3600; // 0-1
                        const peakFactor = 1 + 0.8 * Math.sin(timeOfDay * Math.PI * 2);
                        l.traffic = 20 + 70 * (0.5 + 0.5 * Math.sin(i + this.simTime * 0.1)) * peakFactor;
                        l.traffic = Math.max(5, Math.min(100, l.traffic));
                    });
                    sims.traffic.data = {
                        avgTraffic: this.landmarkData.reduce((s, l) => s + l.traffic, 0) / this.landmarkData.length,
                        peak: Math.max(...this.landmarkData.map(l => l.traffic))
                    };
                }

                // Population Simulation
                if (sims.population.enabled) {
                    sims.population.tick += deltaTime;
                    this.landmarkData.forEach((l) => {
                        // Logistic growth with random fluctuations
                        const growthRate = 0.001 + (l.growth || 1) * 0.002;
                        const carryingCapacity = 2000 + Math.random() * 3000;
                        const noise = 1 + 0.02 * Math.sin(this.simTime * 0.05 + l.pos[0]);
                        l.population += l.population * growthRate * (1 - l.population / carryingCapacity) * noise *
                            deltaTime * 10;
                        l.population = Math.max(50, Math.min(carryingCapacity * 1.1, l.population));
                    });
                    sims.population.data = {
                        total: this.landmarkData.reduce((s, l) => s + l.population, 0),
                        avg: this.landmarkData.reduce((s, l) => s + l.population, 0) / this.landmarkData.length
                    };
                }

                // Weather Simulation
                if (sims.weather.enabled) {
                    sims.weather.tick += deltaTime;
                    this.landmarkData.forEach((l) => {
                        const weatherTypes = ['clear', 'cloudy', 'rain', 'storm', 'fog'];
                        const tempBase = 15 + 10 * Math.sin(this.simTime * 0.0003 + l.pos[0] * 0.1);
                        l.temperature = tempBase + 5 * Math.sin(this.simTime * 0.0005 + l.pos[2] * 0.1);
                        // Weather changes slowly
                        if (Math.random() < 0.001) {
                            l.weather = weatherTypes[Math.floor(Math.random() * weatherTypes.length)];
                        }
                    });
                    sims.weather.data = {
                        avgTemp: this.landmarkData.reduce((s, l) => s + l.temperature, 0) / this.landmarkData.length,
                        conditions: [...new Set(this.landmarkData.map(l => l.weather))]
                    };
                }

                // Urban Growth Simulation
                if (sims.growth.enabled) {
                    sims.growth.tick += deltaTime;
                    this.landmarkData.forEach((l) => {
                        // Growth affects height and population
                        const growthFactor = 0.001 + (l.growth || 1) * 0.003;
                        const heightGrowth = growthFactor * deltaTime * 5;
                        l.height += heightGrowth;
                        l.height = Math.min(20, l.height);
                        // Also affects population
                        l.population += l.population * growthFactor * deltaTime * 20;
                    });
                    sims.growth.data = {
                        avgHeight: this.landmarkData.reduce((s, l) => s + l.height, 0) / this.landmarkData.length,
                        totalGrowth: this.landmarkData.reduce((s, l) => s + l.height - (l.originalHeight || 3), 0)
                    };
                }

                // Store history every 100 ticks
                if (Math.floor(this.simTime * 10) % 100 === 0) {
                    this.history.push({
                        time: this.simTime,
                        ...sims.traffic.data,
                        ...sims.population.data,
                        ...sims.weather.data,
                        ...sims.growth.data
                    });
                    if (this.history.length > 1000) this.history.shift();
                }
            }

            getSimData() {
                const data = {};
                Object.keys(this.simulations).forEach(key => {
                    if (this.simulations[key].enabled) {
                        data[key] = this.simulations[key].data;
                    }
                });
                return data;
            }

            toggleSim(name) {
                if (this.simulations[name]) {
                    this.simulations[name].enabled = !this.simulations[name].enabled;
                    return this.simulations[name].enabled;
                }
                return false;
            }

            togglePause() {
                this.paused = !this.paused;
                return this.paused;
            }

            reset() {
                this.landmarkData.forEach(l => {
                    l.population = 100 + Math.random() * 900;
                    l.traffic = 10 + Math.random() * 90;
                    l.height = l.originalHeight || 3;
                    l.temperature = 15 + Math.random() * 20;
                    l.weather = 'clear';
                });
                this.simTime = 0;
                this.history = [];
                Object.keys(this.simulations).forEach(key => {
                    this.simulations[key].tick = 0;
                    this.simulations[key].data = {};
                });
            }

            getLandmarkData() {
                return this.landmarkData;
            }

            updateLandmarkHeight(index, height) {
                if (this.landmarkData[index]) {
                    this.landmarkData[index].height = height;
                    if (!this.landmarkData[index].originalHeight) {
                        this.landmarkData[index].originalHeight = height;
                    }
                }
            }
        }

        // --- INIT ---
        const container = document.getElementById('canvas-container');
        const loading = document.getElementById('loading');

        // Scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b0e14);
        scene.fog = new THREE.Fog(0x0b0e14, 80, 200);

        // Camera
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 500);
        camera.position.set(25, 20, 35);
        camera.lookAt(0, 0, 0);

        // WebGL Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        // CSS2 Renderer
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0';
        labelRenderer.domElement.style.left = '0';
        labelRenderer.domElement.style.pointerEvents = 'none';
        container.appendChild(labelRenderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.screenSpacePanning = true;
        controls.maxPolarAngle = Math.PI / 2.1;
        controls.minDistance = 3;
        controls.maxDistance = 120;
        controls.target.set(0, 2, 0);

        // --- LIGHTING ---
        const ambient = new THREE.AmbientLight(0x404060, 0.6);
        scene.add(ambient);

        const sun = new THREE.DirectionalLight(0xffeedd, 1.2);
        sun.position.set(40, 50, 30);
        sun.castShadow = true;
        sun.shadow.mapSize.width = 1024;
        sun.shadow.mapSize.height = 1024;
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 150;
        sun.shadow.camera.left = -60;
        sun.shadow.camera.right = 60;
        sun.shadow.camera.top = 60;
        sun.shadow.camera.bottom = -60;
        scene.add(sun);

        const fill = new THREE.DirectionalLight(0x8888ff, 0.3);
        fill.position.set(-30, 20, -40);
        scene.add(fill);

        const hemi = new THREE.HemisphereLight(0x445566, 0x221100, 0.5);
        scene.add(hemi);

        // --- GROUND ---
        const groundGeo = new THREE.PlaneGeometry(200, 200);
        const groundMat = new THREE.MeshStandardMaterial({
            color: 0x1a1f2a,
            roughness: 0.8,
            metalness: 0.1,
            transparent: true,
            opacity: 0.9,
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.5;
        ground.receiveShadow = true;
        scene.add(ground);

        const gridHelper = new THREE.GridHelper(120, 30, 0x4a6a8a, 0x2a3a4a);
        gridHelper.position.y = -0.4;
        scene.add(gridHelper);

        // --- LANDMARK DATA ---
        const landmarkData = [
            { name: 'Eiffel Tower', pos: [-12, 0, -8], color: 0x7a5a3a, height: 6 },
            { name: 'Statue of Liberty', pos: [10, 0, -5], color: 0x6a9a6a, height: 4.5 },
            { name: 'Big Ben', pos: [-5, 0, 14], color: 0x8a7a5a, height: 5 },
            { name: 'Colosseum', pos: [14, 0, 10], color: 0x9a7a5a, height: 3.5 },
            { name: 'Sydney Opera', pos: [-14, 0, 16], color: 0x7a9aaa, height: 4 },
            { name: 'Taj Mahal', pos: [8, 0, -16], color: 0xdaaa7a, height: 5.5 },
            { name: 'Pyramid', pos: [-18, 0, -18], color: 0x8a7a5a, height: 7 },
            { name: 'Burj Khalifa', pos: [20, 0, -20], color: 0x6a8a9a, height: 10 },
        ];

        // --- SIMULATION ENGINE ---
        const simEngine = new SimulationEngine();
        simEngine.initialize(landmarkData);

        // Store editable objects
        const editableObjects = [];
        const labelObjects = [];
        const landmarkMeshes = [];

        function createLandmark(data, simData) {
            const { name, pos, color, height } = data;
            const group = new THREE.Group();

            // Find sim data for this landmark
            const simInfo = simEngine.landmarkData.find(l => l.name === name && Math.abs(l.pos[0] - pos[0]) < 0.1);
            const pop = simInfo ? simInfo.population : 100;
            const traffic = simInfo ? simInfo.traffic : 50;
            const heightScale = simInfo ? simInfo.height / height : 1;

            // Color based on population density
            const popColor = new THREE.Color().setHSL(0.6 - (pop / 3000) * 0.4, 0.7, 0.4 + (pop / 3000) * 0.3);

            // Base
            const baseMat = new THREE.MeshStandardMaterial({
                color: popColor,
                roughness: 0.5,
                metalness: 0.2,
                emissive: popColor.clone().multiplyScalar(0.05 + (traffic / 100) * 0.1),
            });
            const baseGeo = new THREE.BoxGeometry(1.8, 0.4, 1.8);
            const baseMesh = new THREE.Mesh(baseGeo, baseMat);
            baseMesh.position.y = 0.2;
            baseMesh.castShadow = true;
            baseMesh.receiveShadow = true;
            group.add(baseMesh);

            // Main body
            const bodyMat = new THREE.MeshStandardMaterial({
                color: popColor,
                roughness: 0.4,
                metalness: 0.3,
                emissive: popColor.clone().multiplyScalar(0.03 + (traffic / 200) * 0.1),
            });
            const bodyHeight = height * heightScale;
            const bodyGeo = new THREE.CylinderGeometry(0.7, 1.0, bodyHeight, 8);
            const bodyMesh = new THREE.Mesh(bodyGeo, bodyMat);
            bodyMesh.position.y = 0.4 + bodyHeight / 2;
            bodyMesh.castShadow = true;
            bodyMesh.receiveShadow = true;
            group.add(bodyMesh);
            landmarkMeshes.push(bodyMesh);

            // Top beacon (color indicates traffic)
            const trafficColor = new THREE.Color().setHSL(0.3 - (traffic / 100) * 0.3, 1, 0.5);
            const topMat = new THREE.MeshStandardMaterial({
                color: trafficColor,
                emissive: trafficColor,
                emissiveIntensity: 0.3 + (traffic / 100) * 0.5,
            });
            const topGeo = new THREE.SphereGeometry(0.35, 8, 8);
            const topMesh = new THREE.Mesh(topGeo, topMat);
            topMesh.position.y = 0.4 + bodyHeight + 0.2;
            topMesh.castShadow = true;
            group.add(topMesh);

            group.position.set(pos[0], -0.2, pos[2]);
            group.userData = {
                type: 'landmark',
                name: name,
                originalPos: new THREE.Vector3(pos[0], -0.2, pos[2]),
                height: height,
                color: color,
                simIndex: simEngine.landmarkData.findIndex(l => l.name === name && Math.abs(l.pos[0] - pos[0]) < 0.1),
            };

            // Label
            const labelDiv = document.createElement('div');
            labelDiv.textContent = name;
            labelDiv.style.color = '#dde';
            labelDiv.style.fontSize = '14px';
            labelDiv.style.fontWeight = '400';

            const simData = simEngine.getLandmarkData();

            landmarkData.forEach((d, idx) => {

                const dataWithSim = {

                    height: simInfo.height || d.height,
                };
                const { group, label } = createLandmark(dataWithSim, simInfo);
                scene.add(group);

            pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);

            const meshes = [];
            editableObjects.forEach(group => {
                group.children.forEach(child => {
                    if (child.isMesh) {

                    }
                });
            });
            const intersects = raycaster.intersectObjects(meshes);
            if (intersects.length > 0) {
                const hitMesh = intersects[0].object;
                let parentGroup = hitMesh.parent;
                while (parentGroup && !editableObjects.includes(parentGroup)) {

                if (parentGroup && editableObjects.includes(parentGroup)) {
                    return parentGroup;
                }
            }
            return null;
